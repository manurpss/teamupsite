<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#171020"/>
      <stop offset=".55" stop-color="#080b14"/>
      <stop offset="1" stop-color="#10071b"/>
    </linearGradient>
    <linearGradient id="team" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ff0080"/>
      <stop offset="1" stop-color="#ff4fd8"/>
    </linearGradient>
    <linearGradient id="up" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00ffff"/>
      <stop offset="1" stop-color="#6585ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <text x="256" y="238" text-anchor="middle" fill="url(#team)" filter="url(#glow)"
        font-family="Arial Narrow, Impact, sans-serif" font-size="106" font-weight="900" letter-spacing="3">TEAM</text>
  <text x="256" y="348" text-anchor="middle" fill="url(#up)" filter="url(#glow)"
        font-family="Arial Narrow, Impact, sans-serif" font-size="106" font-weight="900" letter-spacing="8">UP</text>
</svg>
